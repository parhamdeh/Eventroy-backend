# Production-style stack. Only Django is published, and only on 127.0.0.1:
# put a reverse proxy (nginx / Caddy / Traefik) with TLS in front of it.
# Databases and brokers are reachable only inside the compose network.
# Required variables are read from .env (see .env.example); compose aborts if one is missing.

x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: config.django.production
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
  ELASTICSEARCH_URL: http://elasticsearch:9200
  ELASTICSEARCH_USER: elastic

x-app-build: &app-build
  context: .
  dockerfile: docker/production.Dockerfile

services:

  db:
    image: postgres:17-alpine
    container_name: eventory_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.2-alpine
    container_name: eventory_rabbitmq
    restart: unless-stopped
    environment:
      # Setting these disables the default guest account.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3

  redis:
    image: redis:8-alpine
    container_name: eventory_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    container_name: eventory_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:?set ELASTICSEARCH_PASSWORD in .env}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  django:
    build: *app-build
    container_name: eventory_django
    restart: unless-stopped
    command: ./docker/web_entrypoint.sh
    env_file: .env
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  celery:
    build: *app-build
    container_name: eventory_worker
    restart: unless-stopped
    command: ./docker/celery_entrypoint.sh
    env_file: .env
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  beats:
    build: *app-build
    container_name: eventory_beats
    restart: unless-stopped
    command: ./docker/beats_entrypoint.sh
    env_file: .env
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  elasticsearch-data: