[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # bugbear
    "S",             # bandit (security)
    "DJ",            # flake8-django
    "UP",            # pyupgrade
    "N",             # pep8-naming
    "C4",            # comprehensions
    "SIM",           # simplify
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"**/test_*.py" = ["S101", "S105", "S106"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["*/migrations/*", "*/tests/*", "manage.py", "config/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true